services:
  db:
    container_name: postgres_container
    image: postgres:17.4
    environment:
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_password
      POSTGRES_DB: db_flights
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/airflow_init.sql:/docker-entrypoint-initdb.d/airflow_init.sql
    ports:
      - 5000:5432
    networks:
      - lab-network

  aflw:
      container_name: airflow_container
      image: apache/airflow:3.0.0
      #build: .
      ports:
        - 8000:8080
      environment:
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_pass@db:5432/airflow_db
        AIRFLOW__DATABASE__LOAD_EXAMPLES: 'false'
      volumes:
        - ./airflow/dags:/opt/airflow/dags
        - ./airflow/data:/opt/airflow/data
        - ./airflow/logs:/opt/airflow/logs
        - ./airflow/plugins:/opt/airflow/plugins
      depends_on:
        - db
      command: > 
        bash -c "airflow db migrate && airflow standalone"
      networks:
        - lab-network


networks:
  lab-network:
  default:
    driver: bridge